[project]
name = "llm-evaluation-monitoring-platform"
version = "0.1.0"
description = "A practical platform for testing, comparing, and monitoring grounded LLM applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.63.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
